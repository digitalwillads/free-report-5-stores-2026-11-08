  const n = d.findings.length;
  const secs = d.findings.map((f, i) => ({ id: `s${i + 1}`, nav: f.nav || f.title, sev: f.severity || "medium",
    html: `<section class="sec" id="s${i + 1}">` +
      `<p class="sec-tag"><span class="dot ${esc(f.severity || "medium")}"></span>${i + 1} of ${n} · ${esc(f.nav || "")}</p>` +
      `<h2 class="headline">${esc(f.title || f.headline)}</h2>` +
      `<div class="callout ${esc(f.severity || "medium")}"><span class="amount">${esc(f.stat)}</span><span class="label">${esc(f.stat_label)}</span></div>` +
      `<p class="explainer">${esc(f.headline)} ${esc(f.why)}</p>` +
      table(f.table) + facts(f) +
      (f.fix ? `<div class="fix"><div class="fix-h"><span aria-hidden="true">🔧</span><span>How to fix it</span></div><p>${esc(f.fix)}</p></div>` : "") +
      check(f) + `</section>` }));
  const read = Array.isArray(d.read) && d.read.length
    ? `<div class="counts">` + d.read.map(([k, w]) => `<div><b>${esc(k)}</b><span>${esc(w)}</span></div>`).join("") + `</div>` : "";
  secs.push({ id: "how", nav: "How we checked", sev: "",
    html: `<section class="sec" id="how"><h2 class="headline">How we made this report</h2>${read}` +
      `<p class="method">We read only public data on ${esc(d.date)}: Google Shopping, Google's search results, Google's and Meta's ad libraries, Google's page speed test, your Google reviews and your public pages. We never clicked your ads, sent your forms or placed an order.</p></section>` });
  secs.push({ id: "next", nav: "Next steps", sev: "",
    html: `<section class="sec next" id="next"><h2 class="headline">Want help fixing these?</h2>` +
      `<p>In a 20-minute call we go through each problem with you, on your own listings and pages, and show you how to fix it.</p>` +
      `<a class="btn" data-book href="#" target="_blank" rel="noopener">Book a 20-minute call</a>` +
      `<p class="by">Prepared for ${esc(d.store.name)} by Digital Will Ads · ${esc(d.date)}</p></section>` });

  document.getElementById("sections").innerHTML = secs.map(s => s.html).join("");
  document.getElementById("nav").innerHTML = secs.map((s, i) =>
    `<a href="#${s.id}" data-sec="${s.id}"><span class="num">${i + 1}</span><span class="dot ${esc(s.sev)}"></span><span>${esc(s.nav)}</span></a>`).join("");
  document.getElementById("side-store").textContent = d.store.name;
  document.getElementById("top-store").textContent = `${d.store.name} · ${d.date}`;
  document.querySelectorAll("[data-book]").forEach(a => { a.href = safeUrl(d.book) || "https://digitalwillads.com"; });

  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-more]");
    if (!b) return;
    const box = b.closest(".ev");
    box.classList.remove("folded");
    console.log("[free-report] rows: show all", { rows: box.querySelectorAll("tbody tr").length });
    b.remove();
  });
  // The side menu marks the section in view; the bottom bar hides on the last section, which has its own button.
  const navLinks = [...document.querySelectorAll(".nav a")];
  const seen = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      navLinks.forEach(a => a.classList.toggle("on", a.dataset.sec === e.target.id));
    }
  }, { rootMargin: "-45% 0px -50% 0px" });
  document.querySelectorAll(".sec").forEach(s => seen.observe(s));
  new IntersectionObserver(([e]) => document.getElementById("bar").classList.toggle("hide", e.isIntersecting), { threshold: 0.15 })
    .observe(document.getElementById("next"));

  console.log("[free-report] render: done", { store: d.store.site, sections: secs.length,
    tables: d.findings.filter(f => f.table).length, ms: Math.round(performance.now() - t0) });
})();
</script>
</body>
</html>
