:root {

* { box-sizing: border-box; }

.nav a:hover { background: #f1f5f9; color: var(--text); }

.callout { display: flex; align-items: baseline; justify-content: center; gap: .75rem; padding: 1rem 1.5rem; margin: 0 0 1.25rem;
  border-radius: 10px; border: 1px solid; text-align: left; }
.callout .amount { font-size: 2rem; font-weight: 800; white-space: nowrap; line-height: 1.1; }
.callout .label { font-size: 1rem; line-height: 1.4; }
.callout.high { background: var(--red-bg); border-color: var(--red-border); } .callout.high .amount { color: var(--red); } .callout.high .label { color: var(--red-ink); }
.callout.medium { background: var(--amber-bg); border-color: var(--amber-border); } .callout.medium .amount { color: #d97706; } .callout.medium .label { color: var(--amber-ink); }
.callout.low { background: var(--blue-bg); border-color: var(--blue-border); } .callout.low .amount { color: var(--primary); } .callout.low .label { color: var(--blue-ink); }

.ev { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin: 0 0 1.25rem; }

.ev th { text-align: left; padding: .6rem .9rem; font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text2);
  background: var(--bg); border-bottom: 1px solid var(--border); white-space: nowrap; }
.ev td { padding: .6rem .9rem; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }

.ev .more { display: block; width: 100%; padding: .65rem; border: 0; border-top: 1px solid var(--border); background: var(--bg); color: var(--primary);

.ev .more:hover { background: #f1f5f9; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem; margin: 0 0 1.25rem; }

.counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; margin: 0 0 1.25rem; }
.method { color: var(--text2); font-size: .92rem; line-height: 1.65; text-align: center; max-width: 640px; margin: 0 auto; }

.btn:hover { background: var(--primary-dark); }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: .75rem 1.5rem; text-align: center; background: rgba(15, 23, 42, .95);

.bar.hide { transform: translateY(100%); opacity: 0; pointer-events: none; }
.bar .btn { font-size: .92rem; padding: .62rem 1.5rem; }
.pad { height: 76px; }

@media (max-width: 1100px) {

  .ev.norank tbody tr { grid-template-columns: minmax(0, 1fr) auto; }

}

// Renders one store's free report from the JSON above: one section a problem, then how we made it, then the next

(() => {
  const t0 = performance.now();

  const safeUrl = u => /^https:\/\//.test(String(u || "")) ? String(u) : "";

  try { d = JSON.parse(document.getElementById("data").textContent); }

  console.log("[free-report] render: start", { store: d.store?.site, findings: d.findings?.length });
  if (!Array.isArray(d.findings) || !d.findings.length) { console.error("[free-report] render: no finding to show", { store: d.store?.site }); return; }

  const table = e => {
    if (!e || !Array.isArray(e.rows) || !e.rows.length) return "";

    const cell = (r, c, role) => role === "img"
      ? `<td class="img">${/^img\/\d+\.jpg$/.test(r.img || "") ? `<img src="${esc(r.img)}" alt="" loading="lazy" width="48" height="48">` : ""}</td>`
      : role === "text" && safeUrl(r.link)
        ? `<td class="text"><a href="${esc(safeUrl(r.link))}" target="_blank" rel="noopener">${esc(c)}</a></td>`
        : `<td class="${esc(role)}">${esc(c)}</td>`;
    const body = e.rows.map((r, j) => `<tr class="${esc(r.cls || "")}${j >= show && r.cls !== "you" ? " extra" : ""}">` +
      (r.cells || []).map((c, i) => cell(r, c, roles[i])).join("") + `</tr>`).join("");
    return `<div class="ev${roles.includes("rank") ? "" : " norank"}${roles.includes("img") ? " withimg" : ""}${fold ? " folded" : ""}">` +
      (e.title ? `<div class="ev-bar">${esc(e.title)}</div>` : "") +
      (e.legend ? `<p class="ev-legend">${esc(e.legend)}</p>` : "") +
      `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>` +
      (fold ? `<button type="button" class="more" data-more>Show all ${e.rows.length} rows</button>` : "") +
      (e.note ? `<p class="ev-note">${esc(e.note)}</p>` : "") + `</div>`;

  const facts = f => !Array.isArray(f.facts) ? "" :

  const n = d.findings.length;

      `<p>In a 20-minute call we go through each problem with you, on your own listings and pages, and show you how to fix it.</p>` +
      `<a class="btn" data-book href="#" target="_blank" rel="noopener">Book a 20-minute call</a>` +

  document.getElementById("sections").innerHTML = secs.map(s => s.html).join("");
  document.getElementById("nav").innerHTML = secs.map((s, i) =>
    `<a href="#${s.id}" data-sec="${s.id}"><span class="num">${i + 1}</span><span class="dot ${esc(s.sev)}"></span><span>${esc(s.nav)}</span></a>`).join("");
  document.getElementById("side-store").textContent = d.store.name;
  document.getElementById("top-store").textContent = `${d.store.name} · ${d.date}`;
  document.querySelectorAll("[data-book]").forEach(a => { a.href = safeUrl(d.book) || "https://digitalwillads.com"; });

  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-more]");
    if (!b) return;
    const box = b.closest(".ev");
    box.classList.remove("folded");
    console.log("[free-report] rows: show all", { rows: box.querySelectorAll("tbody tr").length });
    b.remove();
  });
  // The side menu marks the section in view; the bottom bar hides on the last section, which has its own button.
  const navLinks = [...document.querySelectorAll(".nav a")];
  const seen = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      navLinks.forEach(a => a.classList.toggle("on", a.dataset.sec === e.target.id));
    }
  }, { rootMargin: "-45% 0px -50% 0px" });
  document.querySelectorAll(".sec").forEach(s => seen.observe(s));
  new IntersectionObserver(([e]) => document.getElementById("bar").classList.toggle("hide", e.isIntersecting), { threshold: 0.15 })
    .observe(document.getElementById("next"));

  console.log("[free-report] render: done", { store: d.store.site, sections: secs.length,
    tables: d.findings.filter(f => f.table).length, ms: Math.round(performance.now() - t0) });
})();
</script>
</body>
</html>
